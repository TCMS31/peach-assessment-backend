# PostgreSQL configuration.
#
# Every setting is environment-driven. `DATABASE_URL`, when present, is merged
# over these values by Rails, so a container only needs that one variable.
#
# The generated file hardcoded a production username and read a password from
# PEACHTAKEHOMEBACKEND_DATABASE_PASSWORD; no credential is committed here.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "peachtakehomebackend_development" } %>

# Warning: this database is erased and regenerated by the test suite.
test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME") { "peachtakehomebackend_test" } %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "peachtakehomebackend_production" } %>
