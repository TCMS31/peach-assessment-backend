services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-peach}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-peach}
      POSTGRES_DB: ${DATABASE_NAME:-peachtakehomebackend_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-peach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    # Host port is configurable so this never collides with something already
    # bound to 3000 on the developer's machine.
    ports:
      - "${API_PORT:-8820}:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE, e.g. `rails secret`}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-peach}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-peach}
      DATABASE_NAME: ${DATABASE_NAME:-peachtakehomebackend_production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    depends_on:
      db:
        condition: service_healthy
    # Schema first, then the server. db:prepare is idempotent.
    command: >
      sh -c "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"

volumes:
  pgdata:
